<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0d6ba8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="70" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c8fd6"/>
      <stop offset="100%" stop-color="#0a5686"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="66" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4de"/>
      <stop offset="100%" stop-color="#f0c88a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Far shore -->
  <path d="M0 60 Q30 50 64 58 Q98 66 128 54 L128 0 L0 0 Z" fill="#dff0e0" opacity="0.9"/>
  <!-- Near shore -->
  <path d="M0 128 L0 96 Q32 106 64 98 Q96 90 128 100 L128 128 Z" fill="#3f7a4a"/>

  <!-- River band -->
  <path d="M0 58 Q34 48 64 56 Q96 65 128 52 L128 102 Q96 92 64 100 Q32 108 0 98 Z"
        fill="url(#water)"/>

  <!-- Ripple lines -->
  <path d="M14 70 Q26 66 38 70" stroke="#ffffff" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.35"/>
  <path d="M86 82 Q98 78 112 82" stroke="#ffffff" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.35"/>

  <!-- Dotted crossing trajectory, shore to shore -->
  <path d="M20 62 Q64 44 108 62" stroke="#ffffff" stroke-width="2.5" fill="none"
        stroke-dasharray="1,7" stroke-linecap="round" opacity="0.8"/>

  <!-- Ferry hull -->
  <path d="M42 82 L86 82 L80 94 L48 94 Z" fill="url(#hull)" filter="url(#shadow)"/>
  <!-- Cabin -->
  <rect x="56" y="70" width="16" height="13" rx="2.5" fill="#fff4de" filter="url(#shadow)"/>
  <rect x="59" y="73.5" width="4" height="4" rx="1" fill="#0a5686" opacity="0.6"/>
  <rect x="65" y="73.5" width="4" height="4" rx="1" fill="#0a5686" opacity="0.6"/>
  <!-- Mast + flag -->
  <line x1="64" y1="70" x2="64" y2="56" stroke="#7a5230" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M64 56 L76 60 L64 64 Z" fill="#ff8a3d"/>
</svg>
