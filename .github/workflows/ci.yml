name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version / metainfo consistency
        run: ./check-versions.sh

  build:
    name: build & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pereprava's GTK4/libadwaita bindings come from the system, not pip (see
      # pyproject.toml) — deliberately using the runner's own system python3
      # here (not actions/setup-python's isolated interpreter) so it can see
      # these same packages, matching how install.sh's --system-site-packages
      # venv works and how the flatpak runtime provides them.
      - name: Install GTK4/libadwaita GObject Introspection bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pip gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Install package
        run: pip3 install --break-system-packages -e .
      - name: Import smoke test
        run: python3 -c "import pereprava.pereprava"
